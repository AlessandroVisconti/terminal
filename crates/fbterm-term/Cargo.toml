[package]
name = "fbterm-term"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Reads GSUB and glyph bounds for ligature-only stylistic sets; the version cosmic-text already
# uses (through swash).
skrifa = "0.44"
iced = { workspace = true, features = ["advanced"] }
feathercritty = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
flate2 = { workspace = true }
fbterm-config = { path = "../fbterm-config" }

[dev-dependencies]
iced = { workspace = true, features = ["wgpu", "tokio", "advanced"] }
portable-pty = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }
